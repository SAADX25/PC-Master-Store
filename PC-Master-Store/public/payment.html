<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الدفع الآمن</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="payment-box">
        <h2 style="color:#fff;">إتمام الشراء <i class="fa-solid fa-lock"></i></h2>
        <div class="card-icons">
            <i class="fa-brands fa-cc-visa"></i>
            <i class="fa-brands fa-cc-mastercard"></i>
            <i class="fa-brands fa-paypal"></i>
        </div>
        
        <form id="payForm">
            <input type="text" placeholder="رقم البطاقة" required>
            <div style="display:flex; gap:10px;">
                <input type="text" placeholder="MM/YY" required>
                <input type="text" placeholder="CVC" required>
            </div>
            <input type="text" placeholder="الاسم الكامل" required>
            <button class="cta-btn">دفع الآن</button>
        </form>

        <div id="success" style="display:none; color:#00ff88; margin-top:20px;">
            <h3><i class="fa-solid fa-check-circle"></i> تم الدفع بنجاح!</h3>
            <p style="color:#aaa;">جاري العودة للمتجر...</p>
        </div>
    </div>

    <script>
        document.getElementById('payForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.querySelector('button');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> معالجة...';
            setTimeout(() => {
                document.querySelector('form').style.display = 'none';
                document.getElementById('success').style.display = 'block';
                localStorage.removeItem('myCart');
                setTimeout(() => window.location.href = 'index.html', 3000);
            }, 2000);
        });
    </script>
</body>
</html>
